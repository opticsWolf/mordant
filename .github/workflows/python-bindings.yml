name: Python Bindings

on:
  push:
    branches: [main, master]
    paths:
      - "mordant-py/**"
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "README.md"          # crate docs are include_str!("../README.md") — runs as doctests
      - ".github/workflows/python-bindings.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "mordant-py/**"
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "README.md"          # crate docs are include_str!("../README.md") — runs as doctests
      - ".github/workflows/python-bindings.yml"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build wheel
        run: |
          pip install maturin
          cd mordant-py
          maturin build --release
      - name: Install wheel
        run: |
          pip install --no-index --find-links mordant-py/target/wheels mordant
      - name: Test
        run: |
          pip install pytest
          python -c "import mordant; print(mordant.markdown_to_html('# Hello'))"
          python -m pytest -q mordant-py/tests
      - name: Engine switch smoke test
        run: |
          python -c "import mordant; assert '😄' not in mordant.markdown_to_html(':smile:', engines=mordant.Engines.none())"
          python -c "import mordant; assert '<dl>' in mordant.markdown_to_html('Apple\n: A fruit.\n', engines=mordant.Engines.only(['definition_list']))"
